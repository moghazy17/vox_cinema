name: Check Showtimes

on:
  # Fallback only. The real clock is the Cloudflare Worker in scheduler/, which
  # dispatches this workflow every 15 minutes and actually keeps to it; GitHub's
  # own scheduler drifts 10-60 minutes and drops firings under load. The odd
  # offsets avoid the round-number congestion that makes that worst.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # What to watch lives in watches.json; only credentials and the default
      # timezone come from repo secrets/variables.
      - name: Run showtime check
        env:
          TIMEZONE: ${{ vars.TIMEZONE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_showtimes.py

      - name: Commit state.json if changed
        run: |
          if ! git diff --quiet state.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update notified_for state"
            git push
          else
            echo "state.json unchanged — nothing to commit"
          fi
